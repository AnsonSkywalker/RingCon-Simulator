; AIGC note: project config for Ring-con sim (Joy-Con R gyro emulator)
; Two transports:
;   env:esp32c3      - Arduino + BLE HOGP (NimBLE). R1 reference implementation.
;   env:esp32classic - ESP-IDF + Bluetooth Classic HID (esp_bt_hid_device_*).
;                      The real Joy-Con transport; needs the ORIGINAL ESP32
;                      (only Espressif chip with BR/EDR radio). Built on IDF
;                      because every prebuilt Arduino core libbt.a ships with
;                      the classic HID device profile compiled out.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DJC_ARDUINO=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517
    -DCONFIG_BT_NIMBLE_NVS_PERSIST_BOND=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    +<*> -<joycon_btclassic.cpp> -<idf_main.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    electroniccats/MPU6050@^0.6.0

[env:esp32classic]
platform = espressif32@6.7.0
board = esp32dev
framework = espidf
monitor_speed = 115200
